{% extends "modeladmin/index.html" %}
{% load wagtailadmin_tags %}

{% block extra_js %}
    {{ block.super }}
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const tbody = document.querySelector('.listing tbody');
        if (!tbody) return;

        // Add drag handle and data-id to each row
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(function(row) {
            // Extract ID from the edit link href (e.g., /admin/learning/lesson/edit/123/)
            const editLink = row.querySelector('a[href*="/edit/"]');
            if (editLink) {
                const match = editLink.href.match(/\/edit\/(\d+)\//);
                if (match) {
                    row.setAttribute('data-id', match[1]);
                }
            }
            // Add drag handle as first cell content indicator
            const firstTd = row.querySelector('td');
            if (firstTd) {
                const handle = document.createElement('span');
                handle.className = 'drag-handle';
                handle.innerHTML = '&#x2630;';
                handle.style.cssText = 'cursor: grab; margin-right: 8px; color: #888; font-size: 16px; user-select: none;';
                firstTd.insertBefore(handle, firstTd.firstChild);
            }
        });

        // Initialize SortableJS
        const sortable = new Sortable(tbody, {
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            onEnd: function(evt) {
                // Collect new order
                const orderedIds = [];
                tbody.querySelectorAll('tr[data-id]').forEach(function(row) {
                    orderedIds.push(parseInt(row.getAttribute('data-id')));
                });

                // Send to server
                fetch('{% url "cms:reorder_lessons" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify({ ordered_ids: orderedIds }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        // Update order numbers in the table
                        tbody.querySelectorAll('tr[data-id]').forEach(function(row, index) {
                            const orderCell = row.querySelector('td.field-order .value, td:nth-child(4)');
                            if (orderCell) {
                                orderCell.textContent = index;
                            }
                        });
                    }
                })
                .catch(err => console.error('Reorder failed:', err));
            }
        });
    });
    </script>
    <style>
        .sortable-ghost { opacity: 0.4; background: #f0f7ff !important; }
        .sortable-chosen { background: #e8f0fe !important; }
        .drag-handle:hover { color: #333 !important; }
        .listing tbody tr { transition: background-color 0.15s ease; }

        /* Responsive table for Lessons listing */
        .listing table {
            table-layout: auto;
        }
        .listing .field-title {
            min-width: 180px;
            white-space: normal;
            word-break: break-word;
        }

        /* Tablet breakpoint: hide duration and order */
        @media (max-width: 1100px) {
            .listing .field-duration_minutes,
            .listing th.field-duration_minutes,
            .listing .field-order,
            .listing th.field-order {
                display: none;
            }
        }

        /* Small screens: also hide created_at */
        @media (max-width: 800px) {
            .listing .field-created_at,
            .listing th.field-created_at {
                display: none;
            }
            .listing .field-title {
                min-width: 140px;
            }
        }

        /* Extra small: also hide category, keep only title and is_published */
        @media (max-width: 600px) {
            .listing .field-category,
            .listing th.field-category {
                display: none;
            }
            .listing .field-title {
                min-width: 120px;
            }
        }

        /* Scrollable wrapper fallback */
        .content .result-list {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
{% endblock %}
