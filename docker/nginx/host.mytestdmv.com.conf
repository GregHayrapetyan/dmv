# Host nginx for the VPS (TLS termination).
# Docker publishes:
#   web → 127.0.0.1:3000
#   api → 127.0.0.1:8000
# Bind mounts (set in .env):
#   MEDIA_HOST_PATH=/home/dmv/apps/dmv/media          (or ./data/media)
#   STATIC_HOST_PATH=/home/dmv/apps/dmv/staticfiles   (or ./data/staticfiles)
#
# Install (example):
#   sudo cp docker/nginx/host.mytestdmv.com.conf /etc/nginx/sites-available/mytestdmv.com
#   # adjust ssl + alias paths, then:
#   sudo ln -sf /etc/nginx/sites-available/mytestdmv.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mytestdmv.com api.mytestdmv.com;
    return 301 https://$host$request_uri;
}

############################################################
# FRONTEND (Next.js BFF + pages) — mytestdmv.com → :3000
############################################################

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mytestdmv.com;

    ssl_certificate     /etc/letsencrypt/live/mytestdmv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mytestdmv.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass                 $http_upgrade;
    }
}

############################################################
# BACKEND (Django API + admin/CMS + media/static)
# api.mytestdmv.com → :8000
############################################################

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mytestdmv.com;

    client_max_body_size 5000M;

    ssl_certificate     /etc/letsencrypt/live/mytestdmv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mytestdmv.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Must match MEDIA_HOST_PATH / STATIC_HOST_PATH bind mounts from compose.
    # If the repo lives at /home/dmv/apps/dmv and you use the defaults:
    #   alias /home/dmv/apps/dmv/data/staticfiles/;
    #   alias /home/dmv/apps/dmv/data/media/;
    # Or keep legacy paths and set those env vars to the same directories.

    location /static/ {
        alias /home/dmv/apps/dmv/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /home/dmv/apps/dmv/media/;

        # Pages load images from mytestdmv.com → Referer is the frontend host
        valid_referers none blocked localhost 127.0.0.1 mytestdmv.com *.mytestdmv.com api.mytestdmv.com;
        if ($invalid_referer) {
            return 403;
        }

        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        add_header Accept-Ranges bytes;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Wagtail/admin uploads can be large; keep buffering for normal API JSON
        proxy_request_buffering on;
        proxy_buffering on;
    }
}
